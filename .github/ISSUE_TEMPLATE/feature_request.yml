name: Feature Request
description: Propose a new feature or improvement for My Sweet Home
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        My Sweet Home is offline-first, ad-free, and privacy-focused. Please describe how your proposal fits these principles.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or friction does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the behavior or workflow you would like to see.
    validations:
      required: true
  - type: textarea
    id: privacy_impact
    attributes:
      label: Offline-First and Privacy Impact
      description: Does this require network access, permissions, or new local storage? How is user privacy preserved?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you considered.
    validations:
      required: false
