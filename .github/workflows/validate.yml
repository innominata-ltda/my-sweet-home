name: validate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: signed commits and Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: commit signature verification
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while read -r sha flag; do
            case "$flag" in
              G|U|X|Y|R|E) ;;
              *) echo "::error::commit $sha is unsigned (%G? = $flag)"; bad=1 ;;
            esac
          done < <(git log --format='%H %G?' "$base..$head")
          exit $bad
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: cache commitlint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-commitlint-${{ runner.os }}-v1
      - name: commitlint
        run: |
          npm install --no-save --prefer-offline --no-audit --no-fund @commitlint/cli @commitlint/config-conventional
          python3 -c '
          import subprocess, sys
          base = sys.argv[1]
          head = sys.argv[2]
          commits = subprocess.check_output(["git", "rev-list", "--reverse", f"{base}..{head}"]).decode().split()
          bad = 0
          for c in commits:
              msg = subprocess.check_output(["git", "log", "-1", "--format=%B", c]).decode("utf-8", errors="replace").lstrip("\ufeff")
              p = subprocess.run(["npx", "commitlint"], input=msg.encode("utf-8"))
              if p.returncode != 0:
                  bad = 1
          sys.exit(bad)
          ' "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  secrets:
    name: secrets detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
