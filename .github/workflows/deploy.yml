name: deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Faixa do Google Play para deploy (internal | production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production
      action:
        description: 'Ação a executar no Fastlane'
        required: true
        default: 'build_and_deploy'
        type: choice
        options:
          - build_and_deploy
          - promote_to_production
      rollout:
        description: 'Percentual de rollout para promoção em Produção (ex: 0.1, 0.25, 0.5, 1.0 ou 10%)'
        required: false
        default: '1.0'
        type: string
      build_number:
        description: 'Build number personalizado (opcional; se omitido, usa github.run_number)'
        required: false
        default: ''
        type: string
      build_apks:
        description: 'Compilar também split APKs para download como artefato (mais lento)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Modo simulação (não faz upload real nem promoção na Play Console)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e Deploy Android (Fastlane)
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espaço em disco no runner
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar Ruby e Bundler
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configurar Python
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Configurar Java 17
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Cache Android NDK e CMake
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-cmake-${{ runner.os }}-r28c-3.22.1

      - name: Configurar Flutter via .fvmrc
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Instalar dependências Flutter
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        run: flutter pub get

      - name: Validar integridade pré-build (make verify)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        run: make verify

      - name: Executar Deploy ou Promoção via Fastlane
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          INPUT_TRACK: ${{ inputs.track || 'internal' }}
          INPUT_ACTION: ${{ inputs.action || 'build_and_deploy' }}
          INPUT_ROLLOUT: ${{ inputs.rollout || '1.0' }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
          INPUT_BUILD_APKS: ${{ inputs.build_apks || false }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$INPUT_ACTION" = "promote_to_production" ]; then
            echo "🚀 Executando promote_to_production (track_to: $INPUT_TRACK, rollout: $INPUT_ROLLOUT, dry_run: $INPUT_DRY_RUN)..."
            bundle exec fastlane android promote_to_production promote_to:"$INPUT_TRACK" rollout:"$INPUT_ROLLOUT" dry_run:"$INPUT_DRY_RUN"
          else
            if [ "$INPUT_BUILD_APKS" = "true" ]; then
              echo "🔨 Compilando split APKs ofuscados e validando tamanho (RNF-004, CA-4.2) com build_number: $INPUT_BUILD_NUMBER..."
              bundle exec fastlane android build_apk build_number:"$INPUT_BUILD_NUMBER" obfuscate:true split_debug_info:"build/app/outputs/symbols"
            fi
            echo "🚀 Compilando AAB ofuscado (--obfuscate --split-debug-info) e publicando na faixa $INPUT_TRACK (CA-4.2)..."
            bundle exec fastlane android deploy_internal track:"$INPUT_TRACK" build_number:"$INPUT_BUILD_NUMBER" dry_run:"$INPUT_DRY_RUN" obfuscate:true split_debug_info:"build/app/outputs/symbols"
          fi

      - name: Upload do Android App Bundle (AAB) como artefato
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-bundle-release
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload dos Split APKs como artefatos
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: split-apks-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Limpar build e encerrar Gradle daemon antes de salvar cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production') }}
        run: |
          ./android/gradlew -p android --stop || true
          rm -rf build android/.gradle android/app/build
          rm -f ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/*/plugin-resolution/ || true
