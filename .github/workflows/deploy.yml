name: deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track for deploy (internal | production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production
      action:
        description: 'Fastlane action to run'
        required: true
        default: 'build_and_deploy'
        type: choice
        options:
          - build_and_deploy
          - promote_to_production
      rollout:
        description: 'Rollout percentage for production promotion (e.g. 0.1, 0.25, 0.5, 1.0 or 10%)'
        required: false
        default: '1.0'
        type: string
      build_number:
        description: 'Custom build number (optional; defaults to github.run_number)'
        required: false
        default: ''
        type: string
      build_apks:
        description: 'Also build split APKs to download as an artifact (slower)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry-run mode (skips real upload and promotion in Play Console)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Android (Fastlane)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free up disk space on runner
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Python
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Cache Android NDK and CMake
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-cmake-${{ runner.os }}-r28c-3.22.1

      - name: Set up Flutter via .fvmrc
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Flutter dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        run: flutter pub get

      - name: Validate pre-build integrity (make check)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production' }}
        run: make check

      - name: Run Deploy or Promotion via Fastlane
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TRACK: ${{ inputs.track || 'internal' }}
          INPUT_ACTION: ${{ inputs.action || 'build_and_deploy' }}
          INPUT_ROLLOUT: ${{ inputs.rollout || '1.0' }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number || '' }}
          INPUT_BUILD_APKS: ${{ inputs.build_apks || false }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            INPUT_BUILD_APKS="true"
            if [ -z "$PLAY_STORE_JSON_KEY" ]; then
              INPUT_DRY_RUN="true"
            fi
          fi
          if [ "$INPUT_ACTION" = "promote_to_production" ]; then
            echo "Running promote_to_production (track_to: $INPUT_TRACK, rollout: $INPUT_ROLLOUT, dry_run: $INPUT_DRY_RUN)..."
            bundle exec fastlane android promote_to_production promote_to:"$INPUT_TRACK" rollout:"$INPUT_ROLLOUT" dry_run:"$INPUT_DRY_RUN"
          else
            if [ -z "$INPUT_BUILD_NUMBER" ]; then
              RESOLVED_LINE=$(bundle exec fastlane android resolve_next_build_number min_build_number:"$GITHUB_RUN_NUMBER" | grep -oE 'NEXT_BUILD_NUMBER=[0-9]+' | tail -n1 || true)
              INPUT_BUILD_NUMBER="${RESOLVED_LINE#NEXT_BUILD_NUMBER=}"
              if [ -z "$INPUT_BUILD_NUMBER" ]; then
                INPUT_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
              fi
              echo "Resolved automatic build_number: $INPUT_BUILD_NUMBER"
            fi
            if [ "$INPUT_BUILD_APKS" = "true" ]; then
              echo "Building obfuscated split APKs and validating size with build_number: $INPUT_BUILD_NUMBER..."
              bundle exec fastlane android build_apk build_number:"$INPUT_BUILD_NUMBER" obfuscate:true split_debug_info:"build/app/outputs/symbols"
            fi
            echo "Building obfuscated AAB (--obfuscate --split-debug-info) and publishing to track $INPUT_TRACK..."
            bundle exec fastlane android deploy_internal track:"$INPUT_TRACK" build_number:"$INPUT_BUILD_NUMBER" dry_run:"$INPUT_DRY_RUN" obfuscate:true split_debug_info:"build/app/outputs/symbols"
          fi

      - name: Upload Android App Bundle (AAB) artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-bundle-release
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Split APKs artifacts
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: split-apks-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub Release and artifacts
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%%+*}"
          else
            VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: could not determine release version from GITHUB_REF_NAME or pubspec.yaml" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          echo "Preparing GitHub Release ${TAG}..."

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release_notes.md || true

          if [ ! -s release_notes.md ]; then
            echo "Release ${TAG} (${GITHUB_SHA})" > release_notes.md
          fi

          shopt -s nullglob
          ASSETS=(
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/*.aab
          )
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "Error: no release APK or AAB artifacts found to upload" >&2
            exit 1
          fi

          sha256sum "${ASSETS[@]}" > SHA256SUMS.txt
          ASSETS+=(SHA256SUMS.txt)

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release_notes.md

          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          rm -f release_notes.md SHA256SUMS.txt

      - name: Clean build and stop Gradle daemon before saving cache
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.action != 'promote_to_production') }}
        run: |
          ./android/gradlew -p android --stop || true
          rm -rf build android/.gradle android/app/build
          rm -f ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/*/plugin-resolution/ || true
